name: graph-knowledge-production
x-graph-environment: &graph-environment
  GRAPH_DATASET: public-kg
  GRAPH_DEPLOYMENT: production
  NEO4J_URI: bolt://graph-neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set a private production password}"
  NEO4J_DATABASE: neo4j
  NEO4J_READ_TIMEOUT_MS: "10000"
x-member-environment: &member-environment
  MEMBER_STORAGE_ENABLED: "${MEMBER_STORAGE_ENABLED:-0}"
  MEMBER_AUTH_PROVIDER: google
  MEMBER_ORIGIN: "${MEMBER_ORIGIN:-https://plunode.net}"
  MEMBER_DATABASE_URL: "${MEMBER_DATABASE_URL:-}"
  MEMBER_AUTH_SECRET: "${MEMBER_AUTH_SECRET:-}"
  MEMBER_COOKIE_PREFIX: gk-member-production
  MEMBER_GOOGLE_CLIENT_ID: "${MEMBER_GOOGLE_CLIENT_ID:-}"
  MEMBER_GOOGLE_CLIENT_SECRET: "${MEMBER_GOOGLE_CLIENT_SECRET:-}"
services:
  graph-neo4j:
    image: neo4j:5.26.31-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set a private production password}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    mem_limit: 1536m
    volumes:
      - knowledge:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 --auth-no-challenge --user=neo4j --password=\"$${NEO4J_AUTH#neo4j/}\" --header='Content-Type: application/json' --post-data='{\"statements\":[{\"statement\":\"RETURN 1\"}]}' -O - http://127.0.0.1:7474/db/neo4j/tx/commit | grep -q '\"errors\":\\[\\]'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  web:
    image: "graph-knowledge-web:${GRAPH_IMAGE_TAG:?Set the tested image tag}"
    restart: unless-stopped
    init: true
    depends_on:
      graph-neo4j: { condition: service_healthy }
    environment:
      <<: [*graph-environment, *member-environment]
      COMMUNITY_ENABLED: "${COMMUNITY_ENABLED:-0}"
      SITE_OPERATIONS_ENABLED: "${SITE_OPERATIONS_ENABLED:-0}"
      SITE_OPERATOR_USER_IDS: "${SITE_OPERATOR_USER_IDS:-}"
      PLUNODE_PUBLIC_ENABLED: "${PLUNODE_PUBLIC_ENABLED:-0}"
      PLUNODE_ADS_ENABLED: "${PLUNODE_ADS_ENABLED:-0}"
    networks:
      default: { gw_priority: 0 }
      web-egress: { gw_priority: 1 }
    ports:
      - "127.0.0.1:${GRAPH_WEB_PORT:-3200}:3000"
    mem_limit: 768m
    logging: *logging
  ops:
    image: "graph-knowledge-ops:${GRAPH_IMAGE_TAG:?Set the tested image tag}"
    profiles: [ops]
    init: true
    depends_on:
      graph-neo4j: { condition: service_healthy }
    environment:
      <<: *graph-environment
      MEMBER_STORAGE_ENABLED: "0"
    volumes:
      - "${GRAPH_BACKUP_DIRECTORY:?Set a private backup directory}:/backups"
    logging: *logging
  graph-member-postgres:
    profiles: [member]
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: graph_member
      POSTGRES_PASSWORD: "${MEMBER_POSTGRES_ADMIN_PASSWORD:-}"
      MEMBER_POSTGRES_PASSWORD: "${MEMBER_POSTGRES_PASSWORD:-}"
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30]
    mem_limit: 512m
    volumes:
      - member_data:/var/lib/postgresql/data
      - ./db/member/production-init.sql:/docker-entrypoint-initdb.d/010-member.sql:ro
    healthcheck:
      # 初期化中の一時Unix socket serverではなく、init完了後のTCPを待つ。
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d graph_member"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
  member-ops:
    profiles: [ops]
    image: "graph-knowledge-ops:${GRAPH_IMAGE_TAG:?Set the tested image tag}"
    init: true
    entrypoint: [node, --import, tsx]
    command: [scripts/member-migrate.ts]
    environment:
      <<: *member-environment
      GRAPH_DEPLOYMENT: production
    logging: *logging
volumes:
  knowledge:
  member_data:
networks:
  web-egress:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "${GRAPH_EGRESS_MTU:-1442}"
