name: graph-knowledge-production
x-graph-environment: &graph-environment
  GRAPH_DATASET: public-kg
  GRAPH_DEPLOYMENT: production
  NEO4J_URI: bolt://graph-neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set a private production password}"
  NEO4J_DATABASE: neo4j
  NEO4J_READ_TIMEOUT_MS: "10000"
  MEMBER_STORAGE_ENABLED: "0"
services:
  graph-neo4j:
    image: neo4j:5.26.31-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set a private production password}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    mem_limit: 1536m
    volumes:
      - knowledge:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 --auth-no-challenge --user=neo4j --password=\"$${NEO4J_AUTH#neo4j/}\" --header='Content-Type: application/json' --post-data='{\"statements\":[{\"statement\":\"RETURN 1\"}]}' -O - http://127.0.0.1:7474/db/neo4j/tx/commit | grep -q '\"errors\":\\[\\]'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  web:
    image: "graph-knowledge-web:${GRAPH_IMAGE_TAG:?Set the tested image tag}"
    restart: unless-stopped
    init: true
    depends_on:
      graph-neo4j: { condition: service_healthy }
    environment: *graph-environment
    ports:
      - "127.0.0.1:${GRAPH_WEB_PORT:-3200}:3000"
    mem_limit: 768m
    logging: *logging
  ops:
    image: "graph-knowledge-ops:${GRAPH_IMAGE_TAG:?Set the tested image tag}"
    profiles: [ops]
    init: true
    depends_on:
      graph-neo4j: { condition: service_healthy }
    environment: *graph-environment
    volumes:
      - "${GRAPH_BACKUP_DIRECTORY:?Set a private backup directory}:/backups"
    logging: *logging
volumes:
  knowledge:
