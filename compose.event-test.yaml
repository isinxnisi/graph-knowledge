name: graph-knowledge-event-contract-test
services:
  neo4j:
    image: neo4j:5.26.31-community
    ports:
      - "127.0.0.1:7693:7687"
    environment:
      NEO4J_AUTH: "neo4j/local-event-contract-test"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p local-event-contract-test 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s
