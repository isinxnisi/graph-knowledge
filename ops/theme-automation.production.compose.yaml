# Reviewed separately from the common Web/knowledge-worker release.
# Relative paths are resolved from the first Compose file on the production host.
services:
  web:
    environment:
      THEME_AUTOMATION_ENABLED: "1"
  theme-automation:
    image: "${THEME_AUTOMATION_IMAGE:?Set the verified theme automation image}"
    profiles: [theme-automation]
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: [./theme-automation.env]
    environment:
      GRAPH_DATASET: public-kg
      GRAPH_DEPLOYMENT: production
      MEMBER_STORAGE_ENABLED: "1"
      MEMBER_ORIGIN: https://plunode.net
      MEMBER_AUTH_PROVIDER: google
      MEMBER_COOKIE_PREFIX: gk-member-production
      THEME_AUTOMATION_ENABLED: "1"
      XDG_CACHE_HOME: /tmp/cache
      XDG_CONFIG_HOME: /tmp/config
    tmpfs: ["/tmp:rw,nosuid,nodev,size=268435456,mode=1777"]
    shm_size: 128m
    mem_limit: 768m
    networks:
      default: {gw_priority: 0}
      web-egress: {gw_priority: 1}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
